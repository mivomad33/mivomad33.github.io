<!doctype html>
<!-- OG 이미지 원본(public/og.png). 어두운 터미널 화면. make-images.sh로 PNG를 만든다.
     data-profile 글자는 프로필 값(intro는 intro.ko)과 같아야 한다(빌드 결과 검사가 비교한다). 영어 이미지는 og-image-en.html이다. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="_fonts.css" />
<style>
  body { background: #1f2328; color: #f3f4f6; padding: 90px 96px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .cmd { font-size: 34px; color: #9da7b3; }
  .name { font-size: 96px; font-weight: 700; line-height: 1.1; }
  .intro { font-size: 44px; color: #d0d7de; }
  .accent { color: #4ac26b; }
  .cursor { display: inline-block; width: 0.55em; height: 1em; background: #4ac26b; vertical-align: -0.12em; margin-left: 8px; }
</style>
<div class="cmd mono"><span class="accent">~/</span> $ whoami</div>
<div class="name mono"><span data-profile="name">mivomad33</span><span class="cursor"></span></div>
<div class="intro" data-profile="intro">1인 사업가를 꿈꾸는 개발자</div>
