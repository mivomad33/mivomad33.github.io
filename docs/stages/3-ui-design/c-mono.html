<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 C: 개발자 모노형</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* 디자인 값. @theme로 그대로 옮길 수 있는 이름을 쓰고, 아래 스타일은 이 변수만 쓴다.
         (테두리 두께와 화면 폭 기준 40rem = Tailwind 기본 sm은 Tailwind 기본 값이라 그대로 적는다.)
         고정폭 글꼴에 한글이 없고 공백이 넓어 한글 문장이 벌어져 보이므로,
         한글이 들어가는 문장(제목, 소개, 링크명, 화면 문구)은 고딕(--font-sans)으로 쓰고
         기호(~/, #, >, [ ], →), 날짜, 사이트 이름만 고정폭(--font-mono)으로 쓴다. */
      :root {
        --color-bg: #fcfcfc;
        --color-surface: #f3f4f6;
        --color-text: #1f2328;
        --color-muted: #656d76;
        --color-border: #d0d7de;
        --color-accent: #1a7f37;
        --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Noto Sans KR', sans-serif;
        --font-mono: 'JetBrains Mono', 'Pretendard Variable', Pretendard, ui-monospace, Menlo, monospace;
        --text-xs: 0.75rem;
        --text-sm: 0.8125rem;
        --text-base: 0.9375rem;
        --text-lg: 1.0625rem;
        --text-xl: 1.25rem;
        --text-2xl: 1.625rem;
        --leading-tight: 1.4;
        --leading-normal: 1.65;
        --leading-relaxed: 1.8;
        --font-weight-bold: 700;
        --spacing: 0.25rem;
        --container-content: 46rem;
        --radius-sm: 0.25rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      h1,
      h2,
      h3,
      p,
      dl,
      dd {
        margin: 0;
      }
      .wrap {
        max-width: var(--container-content);
        margin-inline: auto;
        padding-inline: calc(var(--spacing) * 5);
      }

      /* 헤더 */
      .site-header {
        border-bottom: 1px dashed var(--color-border);
        font-family: var(--font-mono);
      }
      .site-header-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: calc(var(--spacing) * 2) calc(var(--spacing) * 6);
        padding-block: calc(var(--spacing) * 5);
      }
      .site-name {
        font-weight: var(--font-weight-bold);
      }
      .site-name::before {
        content: '~/';
        color: var(--color-accent);
      }
      .menu {
        display: flex;
        gap: calc(var(--spacing) * 3);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
      }
      .menu a {
        color: var(--color-muted);
      }
      /* 현재 메뉴를 [ ]로 감싼다. 다른 메뉴도 투명한 괄호를 둬 글자 위치가 바뀌지 않게 한다. */
      .menu a::before,
      .menu a::after {
        font-family: var(--font-mono);
      }
      .menu a::before {
        content: '[';
        color: transparent;
      }
      .menu a::after {
        content: ']';
        color: transparent;
      }
      .menu a:hover {
        color: var(--color-text);
      }
      .menu a[aria-current='page'] {
        color: var(--color-accent);
        font-weight: var(--font-weight-bold);
      }
      .menu a[aria-current='page']::before,
      .menu a[aria-current='page']::after {
        color: var(--color-accent);
      }

      .site-main {
        padding-block: calc(var(--spacing) * 12) calc(var(--spacing) * 16);
      }

      /* 푸터 */
      .site-footer {
        border-top: 1px dashed var(--color-border);
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
      }
      .site-footer-inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: calc(var(--spacing) * 3);
        padding-block: calc(var(--spacing) * 8);
      }
      .footer-links {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 4);
        font-family: var(--font-sans);
      }
      .footer-links a:hover {
        color: var(--color-accent);
      }

      /* 홈 */
      .home-intro {
        font-size: var(--text-xl);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
        margin-bottom: calc(var(--spacing) * 14);
      }
      .home-intro::before {
        content: '> ';
        color: var(--color-accent);
        font-family: var(--font-mono);
      }
      .home-section + .home-section {
        margin-top: calc(var(--spacing) * 14);
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: calc(var(--spacing) * 4);
        margin-bottom: calc(var(--spacing) * 6);
      }
      .section-title {
        font-size: var(--text-base);
        font-weight: var(--font-weight-bold);
      }
      .section-title::before {
        content: '## ';
        color: var(--color-accent);
        font-family: var(--font-mono);
      }
      .section-more {
        flex-shrink: 0;
        color: var(--color-muted);
        font-size: var(--text-sm);
      }
      .section-more::after {
        content: ' →';
      }
      .section-more:hover {
        color: var(--color-accent);
      }

      .page-title {
        font-size: var(--text-2xl);
        line-height: var(--leading-tight);
        margin-bottom: calc(var(--spacing) * 10);
      }
      .page-title::before {
        content: '# ';
        color: var(--color-accent);
        font-family: var(--font-mono);
      }

      /* 포트폴리오: 왼쪽 선으로 구분한 목록 */
      .card-list {
        display: grid;
        gap: calc(var(--spacing) * 7);
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 1.5);
        padding-left: calc(var(--spacing) * 4);
        border-left: 2px solid var(--color-border);
      }
      .card:hover {
        border-left-color: var(--color-accent);
      }
      .card-title {
        font-size: var(--text-base);
        line-height: var(--leading-tight);
      }
      .card-desc {
        color: var(--color-muted);
      }
      .card-links {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 4);
        font-size: var(--text-sm);
      }
      .card-links a {
        color: var(--color-accent);
      }
      .card-links a::before {
        content: '→ ';
        font-family: var(--font-mono);
      }
      .card-links a:hover {
        text-decoration: underline;
      }

      /* 글 목록: 날짜를 제목 앞에 둔다 */
      .post-list {
        display: grid;
        gap: calc(var(--spacing) * 6);
      }
      .post-item {
        display: grid;
        gap: calc(var(--spacing) * 0.5) calc(var(--spacing) * 5);
      }
      @media (min-width: 40rem) {
        .post-item {
          grid-template-columns: max-content minmax(0, 1fr);
        }
        .post-item-desc {
          grid-column: 2;
        }
      }
      .post-item-date {
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        padding-top: calc(var(--spacing) * 0.5);
      }
      .post-item-title {
        font-size: var(--text-base);
        line-height: var(--leading-tight);
      }
      .post-item-title a:hover {
        color: var(--color-accent);
        text-decoration: underline;
      }
      .post-item-desc {
        color: var(--color-muted);
        font-size: var(--text-sm);
      }

      /* 소개 */
      .about-intro {
        margin-top: calc(var(--spacing) * -6);
        margin-bottom: calc(var(--spacing) * 10);
        color: var(--color-muted);
      }
      .about-info {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: calc(var(--spacing) * 3) calc(var(--spacing) * 6);
        font-size: var(--text-sm);
      }
      .about-info dt {
        color: var(--color-muted);
      }
      .about-info dt::after {
        content: ':';
      }
      .about-info a,
      .prose a {
        color: var(--color-accent);
      }
      .about-info a:hover {
        text-decoration: underline;
      }
      .about-links {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 4);
      }

      /* 글 보기 */
      .post-header {
        margin-bottom: calc(var(--spacing) * 10);
      }
      .post-title {
        font-size: var(--text-2xl);
        line-height: var(--leading-tight);
      }
      .post-meta {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 3);
        margin-top: calc(var(--spacing) * 3);
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
      }
      /* "수정"은 한글이므로 고딕, 날짜만 고정폭 */
      .post-updated {
        font-family: var(--font-sans);
      }
      .post-updated::before {
        content: '·';
        margin-right: calc(var(--spacing) * 3);
      }
      .post-updated time {
        font-family: var(--font-mono);
      }

      .prose {
        line-height: var(--leading-relaxed);
      }
      .prose > * + * {
        margin-top: calc(var(--spacing) * 5);
      }
      .prose h2,
      .prose h3 {
        line-height: var(--leading-tight);
      }
      .prose h2 {
        margin-top: calc(var(--spacing) * 12);
        font-size: var(--text-xl);
      }
      .prose h3 {
        margin-top: calc(var(--spacing) * 8);
        font-size: var(--text-lg);
      }
      .prose h2::before,
      .prose h3::before {
        color: var(--color-accent);
        font-family: var(--font-mono);
      }
      .prose h2::before {
        content: '## ';
      }
      .prose h3::before {
        content: '### ';
      }
      .prose ul,
      .prose ol {
        padding-left: calc(var(--spacing) * 6);
      }
      .prose ul {
        list-style: '- ';
      }
      .prose li + li {
        margin-top: calc(var(--spacing) * 1);
      }
      .prose a {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .prose blockquote {
        margin-inline: 0;
        padding-left: calc(var(--spacing) * 4);
        border-left: 2px solid var(--color-accent);
        color: var(--color-muted);
      }
      .prose code {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        padding: calc(var(--spacing) * 0.5) calc(var(--spacing) * 1);
        background: var(--color-surface);
        border-radius: var(--radius-sm);
      }
      /* 코드 블록은 틀만 시안이다. 배경색과 문법 색은 6단계 하이라이팅 테마를 따른다. */
      .prose pre {
        overflow-x: auto;
        padding: calc(var(--spacing) * 4);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        line-height: var(--leading-normal);
        overflow-wrap: normal;
      }
      .prose pre code {
        padding: 0;
        background: none;
      }

      /* 이전·다음 글: 위아래로 쌓은 두 줄 */
      .pager {
        display: grid;
        margin-top: calc(var(--spacing) * 14);
        border-top: 1px dashed var(--color-border);
      }
      .pager-link {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 0.5);
        padding-block: calc(var(--spacing) * 4);
        border-bottom: 1px dashed var(--color-border);
      }
      @media (min-width: 40rem) {
        .pager-link {
          flex-direction: row;
          align-items: baseline;
          gap: calc(var(--spacing) * 4);
        }
      }
      .pager-label {
        flex-shrink: 0;
        color: var(--color-accent);
        font-size: var(--text-sm);
      }
      .pager-prev .pager-label::before {
        content: '← ';
        font-family: var(--font-mono);
      }
      .pager-next .pager-label::after {
        content: ' →';
        font-family: var(--font-mono);
      }
      .pager-link:hover .pager-title {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="shared.js"></script>
    <script>
      // 날짜 형식: 2026-10-20
      Mock.start(({ y, m, d }) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
    </script>
  </body>
</html>
