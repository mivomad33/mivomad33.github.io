<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 B: 글 중심 에디토리얼형</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* 디자인 값. @theme로 그대로 옮길 수 있는 이름을 쓰고, 아래 스타일은 이 변수만 쓴다.
         (테두리 두께와 화면 폭 기준 40rem = Tailwind 기본 sm은 Tailwind 기본 값이라 그대로 적는다.) */
      :root {
        --color-bg: #faf8f3;
        --color-surface: #f1ece1;
        --color-text: #2b2a27;
        --color-muted: #7a756b;
        --color-border: #e2dccf;
        --color-accent: #9a3412;
        --font-serif: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
        --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Noto Sans KR', sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --text-xs: 0.75rem;
        --text-sm: 0.875rem;
        --text-base: 1.0625rem;
        --text-lg: 1.25rem;
        --text-xl: 1.5rem;
        --text-2xl: 2rem;
        --leading-tight: 1.4;
        --leading-normal: 1.75;
        --leading-relaxed: 1.95;
        --tracking-wide: 0.08em;
        --font-weight-bold: 700;
        --spacing: 0.25rem;
        --container-content: 40rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-serif);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      h1,
      h2,
      h3,
      p,
      dl,
      dd {
        margin: 0;
      }
      .wrap {
        max-width: var(--container-content);
        margin-inline: auto;
        padding-inline: calc(var(--spacing) * 6);
      }

      /* 헤더: 가운데 정렬 */
      .site-header-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--spacing) * 4);
        padding-block: calc(var(--spacing) * 12) calc(var(--spacing) * 6);
      }
      .site-name {
        font-size: var(--text-xl);
        font-weight: var(--font-weight-bold);
      }
      .menu {
        display: flex;
        gap: calc(var(--spacing) * 6);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
      }
      .menu a {
        color: var(--color-muted);
      }
      .menu a:hover {
        color: var(--color-text);
      }
      .menu a[aria-current='page'] {
        color: var(--color-accent);
        text-decoration: underline;
        text-underline-offset: 0.4em;
      }

      .site-main {
        padding-block: calc(var(--spacing) * 10) calc(var(--spacing) * 20);
      }

      /* 푸터: 가운데 정렬 */
      .site-footer {
        border-top: 1px solid var(--color-border);
        color: var(--color-muted);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
      }
      .site-footer-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--spacing) * 3);
        padding-block: calc(var(--spacing) * 10);
        text-align: center;
      }
      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: calc(var(--spacing) * 5);
      }
      .footer-links a:hover {
        color: var(--color-text);
      }

      /* 홈 */
      .home-intro {
        font-size: var(--text-xl);
        line-height: var(--leading-tight);
        text-align: center;
        margin-bottom: calc(var(--spacing) * 16);
      }
      .home-section + .home-section {
        margin-top: calc(var(--spacing) * 16);
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: calc(var(--spacing) * 4);
        padding-bottom: calc(var(--spacing) * 3);
        border-bottom: 1px solid var(--color-text);
        font-family: var(--font-sans);
      }
      .section-title {
        font-size: var(--text-xs);
        font-weight: var(--font-weight-bold);
        letter-spacing: var(--tracking-wide);
      }
      .section-more {
        flex-shrink: 0;
        color: var(--color-muted);
        font-size: var(--text-xs);
      }
      .section-more::after {
        content: ' →';
      }
      .section-more:hover {
        color: var(--color-accent);
      }

      .page-title {
        font-size: var(--text-2xl);
        line-height: var(--leading-tight);
        text-align: center;
        margin-bottom: calc(var(--spacing) * 10);
      }

      /* 포트폴리오: 상자 없이 구분선으로 나눈 목록 */
      .card {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 2);
        padding-block: calc(var(--spacing) * 7);
        border-bottom: 1px solid var(--color-border);
      }
      .card-title {
        font-size: var(--text-lg);
        line-height: var(--leading-tight);
      }
      .card-links {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 5);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
      }
      .card-links a {
        color: var(--color-accent);
      }
      .card-links a::after {
        content: ' ↗';
      }
      .card-links a:hover {
        text-decoration: underline;
      }

      /* 글 목록: 넓은 화면에서 날짜를 왼쪽 칸에 둔다 */
      .post-item {
        display: grid;
        gap: calc(var(--spacing) * 1);
        padding-block: calc(var(--spacing) * 7);
        border-bottom: 1px solid var(--color-border);
      }
      @media (min-width: 40rem) {
        .post-item {
          grid-template-columns: calc(var(--spacing) * 28) minmax(0, 1fr);
          column-gap: calc(var(--spacing) * 6);
        }
        .post-item-date {
          grid-row: 1 / span 2;
          padding-top: calc(var(--spacing) * 1);
        }
      }
      .post-item-date {
        color: var(--color-muted);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
      }
      .post-item-title {
        font-size: var(--text-lg);
        line-height: var(--leading-tight);
      }
      .post-item-title a:hover {
        color: var(--color-accent);
      }
      .post-item-desc {
        color: var(--color-muted);
        font-size: var(--text-sm);
        font-family: var(--font-sans);
      }

      /* 소개 */
      .about-intro {
        font-size: var(--text-lg);
        text-align: center;
        margin-top: calc(var(--spacing) * -6);
        margin-bottom: calc(var(--spacing) * 12);
      }
      .about-info {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: calc(var(--spacing) * 4) calc(var(--spacing) * 8);
        padding-top: calc(var(--spacing) * 8);
        border-top: 1px solid var(--color-border);
      }
      .about-info dt {
        color: var(--color-muted);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        padding-top: calc(var(--spacing) * 0.5);
      }
      .about-info a,
      .prose a {
        color: var(--color-accent);
      }
      .about-info a:hover {
        text-decoration: underline;
      }
      .about-links {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 5);
      }

      /* 글 보기 */
      .post-header {
        text-align: center;
        margin-bottom: calc(var(--spacing) * 12);
        padding-bottom: calc(var(--spacing) * 10);
        border-bottom: 1px solid var(--color-border);
      }
      .post-title {
        font-size: var(--text-2xl);
        line-height: var(--leading-tight);
      }
      .post-meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: calc(var(--spacing) * 3);
        margin-top: calc(var(--spacing) * 5);
        color: var(--color-muted);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
      }
      .post-updated::before {
        content: '·';
        margin-right: calc(var(--spacing) * 3);
      }

      .prose {
        line-height: var(--leading-relaxed);
      }
      .prose > * + * {
        margin-top: calc(var(--spacing) * 6);
      }
      .prose h2 {
        margin-top: calc(var(--spacing) * 14);
        font-size: var(--text-xl);
        line-height: var(--leading-tight);
      }
      .prose h3 {
        margin-top: calc(var(--spacing) * 10);
        font-size: var(--text-lg);
        line-height: var(--leading-tight);
      }
      .prose ul,
      .prose ol {
        padding-left: calc(var(--spacing) * 6);
      }
      .prose ul {
        list-style: disc;
      }
      .prose li + li {
        margin-top: calc(var(--spacing) * 2);
      }
      .prose a {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .prose blockquote {
        margin-inline: 0;
        padding-left: calc(var(--spacing) * 5);
        border-left: 2px solid var(--color-accent);
        font-size: var(--text-lg);
      }
      .prose code {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        padding: calc(var(--spacing) * 0.5) calc(var(--spacing) * 1);
        background: var(--color-surface);
      }
      /* 코드 블록은 틀만 시안이다. 배경색과 문법 색은 6단계 하이라이팅 테마를 따른다. */
      .prose pre {
        overflow-x: auto;
        padding: calc(var(--spacing) * 5);
        background: var(--color-surface);
        line-height: var(--leading-normal);
        overflow-wrap: normal;
      }
      .prose pre code {
        padding: 0;
        background: none;
      }

      /* 이전·다음 글: 구분선 아래 두 줄 */
      .pager {
        display: grid;
        margin-top: calc(var(--spacing) * 16);
        border-top: 1px solid var(--color-text);
      }
      @media (min-width: 40rem) {
        .pager {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          column-gap: calc(var(--spacing) * 8);
        }
        .pager-next {
          grid-column: 2;
          text-align: right;
        }
      }
      .pager-link {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 1);
        padding-block: calc(var(--spacing) * 6);
      }
      .pager-link + .pager-link {
        border-top: 1px solid var(--color-border);
      }
      @media (min-width: 40rem) {
        .pager-link + .pager-link {
          border-top: 0;
        }
      }
      .pager-label {
        color: var(--color-muted);
        font-family: var(--font-sans);
        font-size: var(--text-xs);
        letter-spacing: var(--tracking-wide);
      }
      .pager-prev .pager-label::before {
        content: '← ';
      }
      .pager-next .pager-label::after {
        content: ' →';
      }
      .pager-title {
        line-height: var(--leading-tight);
      }
      .pager-link:hover .pager-title {
        color: var(--color-accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="shared.js"></script>
    <script>
      // 날짜 형식: 2026. 10. 20.
      Mock.start(({ y, m, d }) => `${y}. ${m}. ${d}.`);
    </script>
  </body>
</html>
