<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 A: 깔끔한 기본형</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      /* 디자인 값. @theme로 그대로 옮길 수 있는 이름을 쓰고, 아래 스타일은 이 변수만 쓴다.
         (테두리 두께와 화면 폭 기준 40rem = Tailwind 기본 sm은 Tailwind 기본 값이라 그대로 적는다.) */
      :root {
        --color-bg: #ffffff;
        --color-surface: #f5f6f8;
        --color-text: #1b1d21;
        --color-muted: #6b7280;
        --color-border: #e5e7eb;
        --color-accent: #2563eb;
        --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Noto Sans KR', sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --text-xs: 0.8125rem;
        --text-sm: 0.875rem;
        --text-base: 1rem;
        --text-lg: 1.125rem;
        --text-xl: 1.375rem;
        --text-2xl: 1.75rem;
        --leading-tight: 1.35;
        --leading-normal: 1.65;
        --leading-relaxed: 1.8;
        --font-weight-medium: 500;
        --font-weight-bold: 700;
        --spacing: 0.25rem;
        --container-content: 44rem;
        --radius-sm: 0.25rem;
        --radius-md: 0.5rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      h1,
      h2,
      h3,
      p,
      dl,
      dd {
        margin: 0;
      }
      .wrap {
        max-width: var(--container-content);
        margin-inline: auto;
        padding-inline: calc(var(--spacing) * 5);
      }

      /* 헤더 */
      .site-header {
        border-bottom: 1px solid var(--color-border);
      }
      .site-header-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: calc(var(--spacing) * 3) calc(var(--spacing) * 6);
        padding-block: calc(var(--spacing) * 5);
      }
      .site-name {
        font-size: var(--text-lg);
        font-weight: var(--font-weight-bold);
      }
      .menu {
        display: flex;
        gap: calc(var(--spacing) * 5);
      }
      .menu a {
        color: var(--color-muted);
        padding-bottom: calc(var(--spacing) * 1);
        border-bottom: 2px solid transparent;
      }
      .menu a:hover {
        color: var(--color-text);
      }
      .menu a[aria-current='page'] {
        color: var(--color-text);
        font-weight: var(--font-weight-medium);
        border-bottom-color: var(--color-accent);
      }

      .site-main {
        padding-block: calc(var(--spacing) * 12) calc(var(--spacing) * 16);
      }

      /* 푸터 */
      .site-footer {
        border-top: 1px solid var(--color-border);
        color: var(--color-muted);
        font-size: var(--text-sm);
      }
      .site-footer-inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: calc(var(--spacing) * 3);
        padding-block: calc(var(--spacing) * 8);
      }
      .footer-links {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 4);
      }
      .footer-links a:hover {
        color: var(--color-text);
      }

      /* 홈 */
      .home-intro {
        font-size: var(--text-2xl);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
        margin-bottom: calc(var(--spacing) * 14);
      }
      .home-section + .home-section {
        margin-top: calc(var(--spacing) * 14);
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: calc(var(--spacing) * 4);
        margin-bottom: calc(var(--spacing) * 5);
      }
      .section-title {
        font-size: var(--text-lg);
        font-weight: var(--font-weight-bold);
      }
      .section-more {
        flex-shrink: 0;
        color: var(--color-muted);
        font-size: var(--text-sm);
      }
      .section-more::after {
        content: ' →';
      }
      .section-more:hover {
        color: var(--color-accent);
      }

      .page-title {
        font-size: var(--text-2xl);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
        margin-bottom: calc(var(--spacing) * 8);
      }

      /* 포트폴리오 카드 */
      .card-list {
        display: grid;
        gap: calc(var(--spacing) * 4);
      }
      @media (min-width: 40rem) {
        .card-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 2);
        padding: calc(var(--spacing) * 5);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
      }
      .card-title {
        font-size: var(--text-base);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
      }
      .card-desc {
        color: var(--color-muted);
        font-size: var(--text-sm);
      }
      .card-links {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 4);
        margin-top: auto;
        padding-top: calc(var(--spacing) * 2);
        font-size: var(--text-sm);
      }
      .card-links a {
        color: var(--color-accent);
        font-weight: var(--font-weight-medium);
      }
      .card-links a:hover {
        text-decoration: underline;
      }

      /* 글 목록 항목 */
      .post-list {
        display: grid;
        gap: calc(var(--spacing) * 8);
      }
      .post-item {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 1);
      }
      .post-item-title {
        order: 1;
        font-size: var(--text-lg);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
      }
      .post-item-title a:hover {
        color: var(--color-accent);
      }
      .post-item-date {
        order: 2;
        color: var(--color-muted);
        font-size: var(--text-sm);
      }
      .post-item-desc {
        order: 3;
        color: var(--color-muted);
      }

      /* 소개 */
      .about-intro {
        font-size: var(--text-lg);
        margin-top: calc(var(--spacing) * -4);
        margin-bottom: calc(var(--spacing) * 10);
      }
      .about-info {
        display: grid;
        gap: calc(var(--spacing) * 2) calc(var(--spacing) * 6);
      }
      @media (min-width: 40rem) {
        .about-info {
          grid-template-columns: max-content minmax(0, 1fr);
        }
      }
      .about-info dt {
        color: var(--color-muted);
        font-size: var(--text-sm);
      }
      .about-info dd + dt {
        margin-top: calc(var(--spacing) * 3);
      }
      @media (min-width: 40rem) {
        .about-info dd + dt {
          margin-top: 0;
        }
      }
      .about-info a,
      .prose a {
        color: var(--color-accent);
      }
      .about-info a:hover {
        text-decoration: underline;
      }
      .about-links {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 4);
      }

      /* 글 보기 */
      .post-header {
        margin-bottom: calc(var(--spacing) * 10);
      }
      .post-title {
        font-size: var(--text-2xl);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
      }
      .post-meta {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--spacing) * 3);
        margin-top: calc(var(--spacing) * 3);
        color: var(--color-muted);
        font-size: var(--text-sm);
      }
      .post-updated::before {
        content: '·';
        margin-right: calc(var(--spacing) * 3);
      }

      .prose {
        line-height: var(--leading-relaxed);
      }
      .prose > * + * {
        margin-top: calc(var(--spacing) * 5);
      }
      .prose h2 {
        margin-top: calc(var(--spacing) * 12);
        font-size: var(--text-xl);
        line-height: var(--leading-tight);
      }
      .prose h3 {
        margin-top: calc(var(--spacing) * 8);
        font-size: var(--text-lg);
        line-height: var(--leading-tight);
      }
      .prose ul,
      .prose ol {
        padding-left: calc(var(--spacing) * 6);
      }
      .prose ul {
        list-style: disc;
      }
      .prose li + li {
        margin-top: calc(var(--spacing) * 1);
      }
      .prose a {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .prose blockquote {
        margin-inline: 0;
        padding-left: calc(var(--spacing) * 4);
        border-left: 3px solid var(--color-border);
        color: var(--color-muted);
      }
      .prose code {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        padding: calc(var(--spacing) * 0.5) calc(var(--spacing) * 1);
        background: var(--color-surface);
        border-radius: var(--radius-sm);
      }
      /* 코드 블록은 틀만 시안이다. 배경색과 문법 색은 6단계 하이라이팅 테마를 따른다. */
      .prose pre {
        overflow-x: auto;
        padding: calc(var(--spacing) * 4);
        background: var(--color-surface);
        border-radius: var(--radius-md);
        line-height: var(--leading-normal);
        overflow-wrap: normal;
      }
      .prose pre code {
        padding: 0;
        background: none;
      }

      /* 이전·다음 글 */
      .pager {
        display: grid;
        gap: calc(var(--spacing) * 3);
        margin-top: calc(var(--spacing) * 14);
      }
      @media (min-width: 40rem) {
        .pager {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .pager-next {
          grid-column: 2;
          text-align: right;
        }
      }
      .pager-link {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 1);
        padding: calc(var(--spacing) * 4);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
      }
      .pager-link:hover {
        border-color: var(--color-accent);
      }
      .pager-label {
        color: var(--color-muted);
        font-size: var(--text-xs);
      }
      .pager-prev .pager-label::before {
        content: '← ';
      }
      .pager-next .pager-label::after {
        content: ' →';
      }
      .pager-title {
        font-weight: var(--font-weight-medium);
        line-height: var(--leading-tight);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="shared.js"></script>
    <script>
      // 날짜 형식: 2026년 10월 20일
      Mock.start(({ y, m, d }) => `${y}년 ${m}월 ${d}일`);
    </script>
  </body>
</html>
