name: 검증·빌드·배포

# 모든 브랜치 push에서 검증과 빌드를 하고, main push에서만 GitHub Pages로 배포한다.
# 세 작업은 needs로 이어져 있어, 앞 작업이 실패하면 뒤 작업은 실행되지 않는다.
on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    name: 검증(타입 검사·lint·포맷)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check

  build:
    name: 빌드
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 배포가 겹치면 먼저 시작한 배포를 끝까지 마치고 다음 배포를 한다.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
